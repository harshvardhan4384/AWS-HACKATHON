name: AWS ECR Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-ecr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071954287325:role/ReCOVER-GitHubActions-Deploy
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR access
        run: aws ecr describe-repositories --repository-names recover-backend

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Connection successful
        run: echo "GitHub Actions -> AWS OIDC -> ECR connection successful"
